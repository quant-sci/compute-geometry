[project]
name = "compute-geometry"
version = "0.1.2"
description = "Computational Geometry Library"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kleyton da Costa", email = "kleyton.vsc@gmail.com" },
]
maintainers = [
    { name = "Kleyton da Costa", email = "kleyton.vsc@gmail.com" },
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "rich>=13.0.0",
    "seaborn>=0.11.2",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=2.20.0",
    "pytest>=7.1.3",
    "commitizen>=2.40.0",
    "ipykernel>=6.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cgeom"]

[tool.commitizen]
version = "0.7.2"
changelog_incremental = true
version_files = [
    "pyproject.toml:version"
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E/W), import sorting (I)
select = ["E", "F", "W", "I"]
# line length is enforced by the formatter, not the linter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports symbols for the public API
"__init__.py" = ["F401"]
